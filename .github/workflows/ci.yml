name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1})'"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATAHUB_MONGO_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy app tests scripts
      - run: uv run pytest --cov=app --cov-fail-under=70

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage

  smoke:
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --env-file .env.prod up -d --build --wait
      - run: curl --fail --silent --show-error http://localhost:8080/api/health
      - run: curl --fail --silent --show-error --output /dev/null http://localhost:8080/
      - if: failure()
        run: docker compose --env-file .env.prod logs
      - if: always()
        run: docker compose --env-file .env.prod down -v

  publish:
    # Une image n'est publiée que pour une version étiquetée, et seulement si tout est vert.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: backend
            target: ""
          - image: frontend
            target: prod
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          # metadata-action met le nom en minuscules, seule forme acceptée par GHCR :
          # ZiliOussema/DataHub devient ghcr.io/zilioussema/datahub-backend.
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

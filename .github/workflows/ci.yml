name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      mongo:
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1})'"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATAHUB_MONGO_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy app tests scripts
      - run: uv run pytest --cov=app --cov-fail-under=70

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage

  smoke:
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --env-file .env.prod up -d --build --wait
      - run: curl --fail --silent --show-error http://localhost:8080/api/health
      - run: curl --fail --silent --show-error --output /dev/null http://localhost:8080/
      - if: failure()
        run: docker compose --env-file .env.prod logs
      - if: always()
        run: docker compose --env-file .env.prod down -v

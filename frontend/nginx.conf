server {
    listen 80;
    root /usr/share/nginx/html;

    # Désactivée par défaut dans l'image nginx. Le bundle passe de 345 à 124 Ko, et une page
    # de 100 lignes de JSON se compresse tout aussi bien.
    gzip on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json text/css image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8000;
        # Fichiers d'un million de lignes : aucune limite de taille (1 Mo par défaut), envoi
        # transmis au backend au fil de la réception, et temps de réponse large pour la
        # détection des types qui lit tout le fichier avant de répondre.
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # Application monopage : toute route inconnue renvoie index.html.
    location / {
        try_files $uri /index.html;
    }
}
